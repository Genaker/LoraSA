; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; for env:vision-master-e190
; src_dir = tft_src
; for env:vision-master-e290
; src_dir = eink_src
; for env:heltec_wifi_lora_32_V3
; src_dir = src ;;Default
; for heltec_wifi_lora_32_V3-test-signal-generator
; src_dir = trans_src

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.f_cpu = 240000000
lib_deps = 
	ropg/Heltec_ESP32_LoRa_v3@^0.9.1
build_flags = -DHELTEC_POWER_BUTTON

[env:lilygo-T3S3-v1-2]
platform = espressif32
board = t3_s3_v1_x
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.f_cpu = 240000000
lib_deps = 
	ropg/Heltec_ESP32_LoRa_v3@^0.9.1
	RadioLib
build_flags = 
	-DLILYGO
	-DT3_S3_V1_2_SX1262
	-DT3_V1_3_SX1262
	-DARDUINO_LILYGO_T3S3_SX1262
	-DESP32
	-DUSING_SX1262
	-DARDUINO_ARCH_ESP32
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_LILYGO_T3_S3_V1_X
	-DARDUINO_USB_MODE=1

[env:heltec_wifi_lora_32_V3-test-signal-generator]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
upload_speed = 115200
monitor_speed = 115200
board_build.f_cpu = 240000000
board_build.flash_size = 80000000L
lib_deps = 
	ropg/Heltec_ESP32_LoRa_v3@^0.9.1
build_flags = -DLILYGO

[env:vision-master-e290]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_upload.use_1200bps_touch = true
build_flags = 
	-DHELTEC_BOARD=37
	-DSLOW_CLK_TPYE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLoRaWAN_DEBUG_LEVEL=0
	-DE290
	-DESP32
	-DVision_Master_E290
	-DRADIOLIB_EXCLUDE_CC1101=true
	-DRADIOLIB_EXCLUDE_LR11x0=true
	-DRADIOLIB_EXCLUDE_NRF24=true
	-DRADIOLIB_EXCLUDE_RF69=true
	-DRADIOLIB_EXCLUDE_RFM2X=true
	-DRADIOLIB_EXCLUDE_SI443X=true
	-DRADIOLIB_EXCLUDE_SX1231=true
	-DRADIOLIB_EXCLUDE_SX127X=true
	-DRADIOLIB_EXCLUDE_SX128X=true
lib_deps = 
	SPI
	Wire
	adafruit/Adafruit BusIO @ 1.9.6
	https://github.com/HelTecAutomation/Heltec_ESP32/
	adafruit/Adafruit GFX Library@^1.11.10
	ropg/Heltec_ESP32_LoRa_v3@^0.9.1

[env:vision-master-t190]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_upload.use_1200bps_touch = true
build_flags = 
	-DHELTEC_BOARD=38
	-DSLOW_CLK_TPYE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLoRaWAN_DEBUG_LEVEL=0
	-DT190
	-DESP32
	-DVision_Master_T190
	-DRADIOLIB_EXCLUDE_CC1101=true
	-DRADIOLIB_EXCLUDE_LR11x0=true
	-DRADIOLIB_EXCLUDE_NRF24=true
	-DRADIOLIB_EXCLUDE_RF69=true
	-DRADIOLIB_EXCLUDE_RFM2X=true
	-DRADIOLIB_EXCLUDE_SI443X=true
	-DRADIOLIB_EXCLUDE_SX1231=true
	-DRADIOLIB_EXCLUDE_SX127X=true
	-DRADIOLIB_EXCLUDE_SX128X=true
lib_deps = 
	SPI
	Wire
	adafruit/Adafruit BusIO @ 1.9.6
	https://github.com/HelTecAutomation/Heltec_ESP32/
	adafruit/Adafruit GFX Library@^1.11.10
	ropg/Heltec_ESP32_LoRa_v3@^0.9.1
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
